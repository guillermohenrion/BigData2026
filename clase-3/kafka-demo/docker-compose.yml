# Kafka de demo: cluster de 3 brokers en modo KRaft (sin ZooKeeper) + Kafka UI.
# Uso:  docker compose up -d
#   Desde contenedores:   kafka1:19092,kafka2:19092,kafka3:19092
#   Desde tu máquina:     localhost:9092,localhost:9094,localhost:9096   (Python, etc.)
#   Kafka UI:             http://localhost:8084   (8080 lo usa el Master de Spark de la clase 2)
#
# Cada broker escucha en 3 listeners:
#   PLAINTEXT  :19092  tráfico dentro de Docker (entre brokers, Kafka UI, CLIs)
#   EXTERNAL   :9092   clientes desde tu máquina; se anuncia como localhost:909x
#   CONTROLLER :9093   quórum KRaft (reemplaza a ZooKeeper)

x-kafka-env: &kafka-env
  CLUSTER_ID: "Y2xhc2UzLWthZmthLWRlbW8"
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9092
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2          # con acks=all, cada mensaje queda en al menos 2 brokers
  KAFKA_NUM_PARTITIONS: 3
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0   # los consumer groups arrancan sin esperar 3 s
  KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"

x-kafka: &kafka
  image: apache/kafka:4.1.0
  restart: unless-stopped

services:
  kafka1:
    <<: *kafka
    container_name: kafka1
    hostname: kafka1
    ports: ["9092:9092"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:19092,EXTERNAL://localhost:9092
    volumes: [kafka1_data:/var/lib/kafka/data]

  kafka2:
    <<: *kafka
    container_name: kafka2
    hostname: kafka2
    ports: ["9094:9092"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:19092,EXTERNAL://localhost:9094
    volumes: [kafka2_data:/var/lib/kafka/data]

  kafka3:
    <<: *kafka
    container_name: kafka3
    hostname: kafka3
    ports: ["9096:9092"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka3:19092,EXTERNAL://localhost:9096
    volumes: [kafka3_data:/var/lib/kafka/data]

  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: kafka-ui
    ports: ["8084:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: clase3
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:19092,kafka2:19092,kafka3:19092
    depends_on: [kafka1, kafka2, kafka3]

volumes:
  kafka1_data:
  kafka2_data:
  kafka3_data:
